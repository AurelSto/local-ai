services:
  anythingllm:
    image: mintplexlabs/anythingllm@sha256:e98c38142741a5ca77900d3153cb8847464f0cdadaad618802ffeaa1290db818
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "100.90.170.107:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_ADMIN
    env_file:
      - .env
    volumes:
      - anythingllm_storage:/app/server/storage

volumes:
  anythingllm_storage:
    external: true
